<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cap_membrane · live σ₁ field</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d1218; color: #dfe6ee;
               font: 13px/1.45 -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 10px; left: 12px; padding: 9px 12px; border-radius: 8px;
         background: rgba(10,16,22,.78); border: 1px solid #22303c; pointer-events: none;
         white-space: pre; font-variant-numeric: tabular-nums; }
  #hud b { color: #7fd1ff; font-weight: 600; }
  #ctrls { position: fixed; top: 10px; right: 12px; display: flex; gap: 8px; align-items: center; }
  #ctrls button { background: #16212c; color: #dfe6ee; border: 1px solid #2b3a49;
                  border-radius: 7px; padding: 6px 11px; cursor: pointer; font-size: 12px; }
  #ctrls button:hover { border-color: #4a6076; }
  #ctrls button.on { background: #2a4258; border-color: #4a6076; color: #bfe4ff; }
  #frozenTag { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
               font-size: 42px; font-weight: 700; color: rgba(127,209,255,.14);
               letter-spacing: 6px; pointer-events: none; display: none; }
  #frozenTag.show { display: block; }
  #tip { position: fixed; pointer-events: none; display: none; z-index: 5;
         background: rgba(8,13,18,.95); border: 1px solid #33475a; border-radius: 7px;
         padding: 8px 10px; max-width: 260px; box-shadow: 0 6px 22px rgba(0,0,0,.5);
         font-variant-numeric: tabular-nums; }
  #tip .k { color: #8aa0b4; }
  #tip .v { color: #eef4fa; font-weight: 600; }
  #tip .cls { margin-top: 5px; padding-top: 5px; border-top: 1px solid #24333f; }
  .good { color: #6ee69a; } .bad { color: #ff7d72; } .obl { color: #f2c14e; }
  .degen { color: #8aa0b4; }
  #legend { position: fixed; bottom: 14px; left: 12px; padding: 8px 10px; border-radius: 8px;
            background: rgba(10,16,22,.78); border: 1px solid #22303c; }
  #legend canvas { width: 190px; height: 12px; border-radius: 3px; }
  #legend .lab { display: flex; justify-content: space-between; margin-top: 3px;
                 color: #8aa0b4; font-variant-numeric: tabular-nums; }
  #hint { position: fixed; bottom: 14px; right: 12px; color: #607283; text-align: right; }
  #dead { position: fixed; inset: 0; display: none; place-items: center; text-align: center;
          background: rgba(8,12,16,.85); }
  #dead div { max-width: 420px; }
  kbd { background: #1b2733; border: 1px solid #33475a; border-radius: 4px; padding: 1px 6px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="hud">loading…</div>
<div id="ctrls">
  <button id="freezeBtn" title="Space">❚❚ Freeze</button>
  <button id="scaleBtn"  title="colour-ramp scaling">Scale: auto</button>
  <button id="wireBtn"   title="mesh edges">Wire</button>
</div>
<div id="frozenTag">FROZEN</div>
<div id="tip"></div>
<div id="legend">
  <canvas id="lg" width="190" height="12"></canvas>
  <div class="lab"><span>0</span><span id="lgMid"></span><span id="lgMax">σ₁</span></div>
</div>
<div id="hint">hover a triangle for σ₁ &amp; crack direction · <kbd>Space</kbd> freeze</div>
<div id="dead"><div>
  <h3>Waiting for the simulation…</h3>
  <p style="color:#8aa0b4">Start the scene with <kbd>run_cap.ps1 -Heatmap</kbd> (or
  <kbd>--heatmap</kbd>). This page is served by that process; if it stopped, relaunch it.</p>
</div></div>

<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const hud = document.getElementById("hud"), tip = document.getElementById("tip");
const deadEl = document.getElementById("dead");
let GEO = null, verts = null, tris = null, cents = null, radial = null;
let bounds = null, field = null, lastGood = 0, miss = 0;
let frozen = false, scaleMode = "auto", showWire = false, hover = -1, mouse = null;
let scaleTop = 300, dpr = Math.min(window.devicePixelRatio || 1, 2);

// blue -> teal -> green -> amber -> red
const STOPS = [[42,70,150],[38,140,190],[70,185,115],[235,200,64],[217,46,38]];
function ramp(u){
  u = Math.max(0, Math.min(1, u));
  const x = u * (STOPS.length - 1), i = Math.floor(x), f = x - i;
  const a = STOPS[i], b = STOPS[Math.min(i + 1, STOPS.length - 1)];
  return `rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`;
}

async function loadGeometry(){
  const r = await fetch("/geometry"); GEO = await r.json();
  verts = GEO.verts; tris = GEO.tris;
  cents = new Array(tris.length); radial = new Array(tris.length);
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for (const v of verts){ if(v[0]<minx)minx=v[0]; if(v[0]>maxx)maxx=v[0];
                          if(v[1]<miny)miny=v[1]; if(v[1]>maxy)maxy=v[1]; }
  bounds = {minx,maxx,miny,maxy};
  for (let k=0;k<tris.length;k++){
    const [a,b,c] = tris[k];
    const cx=(verts[a][0]+verts[b][0]+verts[c][0])/3, cy=(verts[a][1]+verts[b][1]+verts[c][1])/3;
    cents[k]=[cx,cy];
    const rn=Math.hypot(cx,cy)||1; radial[k]=[cx/rn,cy/rn];
  }
}

function fit(){
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  const W=cv.width,H=cv.height, bw=bounds.maxx-bounds.minx, bh=bounds.maxy-bounds.miny;
  const s = Math.min(W/bw, H/bh)*0.86;
  const ox = (W - bw*s)/2 - bounds.minx*s, oy = (H + bh*s)/2 + bounds.miny*s;
  return {s,ox,oy,W,H};
}
let T = null;
function toScreen(x,y){ return [T.ox + x*T.s, T.oy - y*T.s]; }
function toWorld(px,py){ return [(px*dpr - T.ox)/T.s, (T.oy - py*dpr)/T.s]; }

function degenerate(ar){ return ar < 0.25 || ar > 4.0; }

function draw(){
  if (!bounds){ return; }
  T = fit();
  ctx.clearRect(0,0,T.W,T.H);
  if (!field || !field.s1.length){ return; }
  const s1 = field.s1, ar = field.aratio;
  scaleTop = scaleMode==="fixed" ? field.heatmax : Math.max(field.smax, 20);
  for (let k=0;k<tris.length;k++){
    const [a,b,c]=tris[k];
    const A=toScreen(verts[a][0],verts[a][1]), B=toScreen(verts[b][0],verts[b][1]), C=toScreen(verts[c][0],verts[c][1]);
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); ctx.closePath();
    ctx.fillStyle = degenerate(ar[k]) ? "#38424c" : ramp(s1[k]/scaleTop);
    ctx.fill();
    if (showWire){ ctx.strokeStyle="rgba(0,0,0,.28)"; ctx.lineWidth=1; ctx.stroke(); }
  }
  if (hover>=0){
    const [a,b,c]=tris[hover];
    const A=toScreen(verts[a][0],verts[a][1]), B=toScreen(verts[b][0],verts[b][1]), C=toScreen(verts[c][0],verts[c][1]);
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); ctx.closePath();
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=2; ctx.stroke();
    // sigma1 direction (white) and the crack, which runs perpendicular (dashed)
    const ce=toScreen(cents[hover][0],cents[hover][1]);
    const d=field.dir[hover], L=26*dpr;
    ctx.beginPath(); ctx.moveTo(ce[0]-d[0]*L,ce[1]+d[1]*L); ctx.lineTo(ce[0]+d[0]*L,ce[1]-d[1]*L);
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.setLineDash([5,4]);
    ctx.moveTo(ce[0]+d[1]*L,ce[1]+d[0]*L); ctx.lineTo(ce[0]-d[1]*L,ce[1]-d[0]*L);
    ctx.strokeStyle="#ff5b4d"; ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);
  }
  drawLegend();
}

function drawLegend(){
  const lg=document.getElementById("lg"), g=lg.getContext("2d");
  for(let x=0;x<lg.width;x++){ g.fillStyle=ramp(x/(lg.width-1)); g.fillRect(x,0,1,lg.height); }
  document.getElementById("lgMax").textContent = "σ₁ "+scaleTop.toFixed(0);
  document.getElementById("lgMid").textContent = (scaleTop/2).toFixed(0);
}

function pointInTri(px,py,a,b,c){
  const d1=(px-b[0])*(a[1]-b[1])-(a[0]-b[0])*(py-b[1]);
  const d2=(px-c[0])*(b[1]-c[1])-(b[0]-c[0])*(py-c[1]);
  const d3=(px-a[0])*(c[1]-a[1])-(c[0]-a[0])*(py-a[1]);
  const neg=(d1<0)||(d2<0)||(d3<0), pos=(d1>0)||(d2>0)||(d3>0);
  return !(neg&&pos);
}
function hitTest(){
  if (!mouse || !verts){ hover=-1; return; }
  const [wx,wy]=toWorld(mouse[0],mouse[1]); hover=-1;
  for (let k=0;k<tris.length;k++){
    const [a,b,c]=tris[k];
    if (pointInTri(wx,wy,verts[a],verts[b],verts[c])){ hover=k; break; }
  }
}
function showTip(){
  if (hover<0 || !field || !field.s1.length){ tip.style.display="none"; return; }
  const k=hover, v=field.s1[k], ar=field.aratio[k], d=field.dir[k];
  const rr=Math.hypot(cents[k][0],cents[k][1]);
  let cls, body;
  if (degenerate(ar)){
    cls = `<span class="degen">degenerate (σ₁ not physical)</span>`;
  } else {
    // crack runs PERPENDICULAR to sigma1 (Rankine). Angle of sigma1 vs the radial dir.
    const rad=radial[k]; let dot=Math.abs(d[0]*rad[0]+d[1]*rad[1]); dot=Math.min(1,dot);
    const ang=Math.acos(dot)*180/Math.PI;
    if (ang<30) cls=`<span class="good">crack: CIRCUMFERENTIAL (good, curvilinear)</span>`;
    else if (ang>60) cls=`<span class="bad">crack: RADIAL (runs to periphery!)</span>`;
    else cls=`<span class="obl">crack: oblique (${ang.toFixed(0)}° off radial)</span>`;
  }
  const angDeg=(Math.atan2(d[1],d[0])*180/Math.PI).toFixed(0);
  tip.innerHTML =
    `<span class="k">σ₁ </span><span class="v">${v.toFixed(1)}</span>`+
    `  <span class="k">r </span><span class="v">${rr.toFixed(2)}</span>`+
    `  <span class="k">areaRatio </span><span class="v">${ar.toFixed(2)}</span><br>`+
    `<span class="k">σ₁ dir </span><span class="v">${angDeg}°</span> `+
    `<span class="k">tri</span> ${k}`+
    `<div class="cls">${cls}</div>`;
  tip.style.display="block";
  let tx=mouse[0]+14, ty=mouse[1]+14;
  if (tx+tip.offsetWidth>innerWidth) tx=mouse[0]-tip.offsetWidth-14;
  if (ty+tip.offsetHeight>innerHeight) ty=mouse[1]-tip.offsetHeight-14;
  tip.style.left=tx+"px"; tip.style.top=ty+"px";
}

function updateHud(){
  if (!field){ hud.textContent="waiting for stress data…"; return; }
  hud.innerHTML =
    `t        <b>${(field.t).toFixed(2)}</b> s\n`+
    `peak σ₁  <b>${field.smax.toFixed(1)}</b>\n`+
    `scale    0 … <b>${scaleTop.toFixed(0)}</b>  (${scaleMode})\n`+
    `tris     <b>${tris?tris.length:0}</b>`+
    (frozen? `\n<b>— FROZEN —</b>`:``);
}

async function poll(){
  if (!frozen){
    try {
      const r = await fetch("/stress", {cache:"no-store"});
      field = await r.json(); miss=0; deadEl.style.display="none";
    } catch(e){ if (++miss>15) deadEl.style.display="grid"; }
  }
  hitTest(); draw(); showTip(); updateHud();
  setTimeout(poll, 55);
}

// --- interaction ---
cv.addEventListener("mousemove", e=>{ const r=cv.getBoundingClientRect(); mouse=[e.clientX-r.left,e.clientY-r.top]; });
cv.addEventListener("mouseleave", ()=>{ mouse=null; hover=-1; tip.style.display="none"; });
function setFrozen(f){ frozen=f;
  document.getElementById("freezeBtn").classList.toggle("on",f);
  document.getElementById("frozenTag").classList.toggle("show",f);
  document.getElementById("freezeBtn").textContent = f? "▶ Resume":"❚❚ Freeze"; }
document.getElementById("freezeBtn").onclick=()=>setFrozen(!frozen);
document.getElementById("scaleBtn").onclick=e=>{ scaleMode = scaleMode==="auto"?"fixed":"auto";
  e.target.textContent = "Scale: "+scaleMode; };
document.getElementById("wireBtn").onclick=e=>{ showWire=!showWire; e.target.classList.toggle("on",showWire); };
addEventListener("keydown", e=>{ if (e.code==="Space"){ e.preventDefault(); setFrozen(!frozen); } });
addEventListener("resize", ()=>{ dpr=Math.min(window.devicePixelRatio||1,2); });

(async ()=>{ try { await loadGeometry(); } catch(e){ deadEl.style.display="grid"; } poll(); })();
</script>
</body>
</html>
